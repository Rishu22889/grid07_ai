services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grid07_backend
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - grid07_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: grid07_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - grid07_network

networks:
  grid07_network:
    driver: bridge
