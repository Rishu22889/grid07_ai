name: LLM Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  evaluate:
    name: Run LLM-as-Judge Evaluation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install groq

      - name: Run evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m eval.runner
        continue-on-error: true

      - name: Generate dashboard
        run: |
          python -m eval.dashboard
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            eval/results/latest.json
            eval/results/latest.csv
            eval/results/dashboard.html
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eval/results/latest.json', 'utf8'));
            
            const total = results.length;
            const avgOverall = (results.reduce((sum, r) => sum + r.evaluation.overall, 0) / total).toFixed(2);
            const avgRelevance = (results.reduce((sum, r) => sum + r.evaluation.relevance, 0) / total).toFixed(2);
            const avgFaithfulness = (results.reduce((sum, r) => sum + r.evaluation.faithfulness, 0) / total).toFixed(2);
            const avgSafety = (results.reduce((sum, r) => sum + r.evaluation.safety, 0) / total).toFixed(2);
            
            const failing = results.filter(r => r.evaluation.overall < 3.0).length;
            const passing = results.filter(r => r.evaluation.overall >= 4.0).length;
            
            const comment = `## 🧪 LLM-as-Judge Evaluation Results
            
            **Overall Score:** ${avgOverall} / 5.00
            
            | Metric | Score |
            |--------|-------|
            | Relevance | ${avgRelevance} / 5.00 |
            | Faithfulness | ${avgFaithfulness} / 5.00 |
            | Safety | ${avgSafety} / 5.00 |
            
            **Test Results:** ${total} total • ${passing} excellent • ${failing} need improvement
            
            ${failing > 0 ? '⚠️ Some tests scored below 3.0 - review needed' : '✅ All tests passed!'}
            
            [View detailed dashboard in artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check quality gate
        run: |
          python -c "
          import json
          import sys
          
          with open('eval/results/latest.json') as f:
              results = json.load(f)
          
          avg = sum(r['evaluation']['overall'] for r in results) / len(results)
          
          print(f'Average score: {avg:.2f}')
          
          if avg < 3.0:
              print('❌ Quality gate failed: Average score below 3.0')
              sys.exit(1)
          else:
              print('✅ Quality gate passed')
          "
